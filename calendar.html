<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note — ปฏิทิน</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111110">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
    <div class="page-head">
      <div>
        <div class="page-eyebrow">กำหนดการ</div>
        <h1>ปฏิทิน</h1>
      </div>
      <div class="head-actions">
        <button class="refresh-btn" id="refreshBtn"><span class="glyph">⟳</span> รีเฟรช</button>
        <button class="btn" id="addEventBtn">+ เพิ่มรายการ</button>
      </div>
    </div>

    <div class="dash-grid">
      <div class="panel">
        <div class="panel-body" id="calWrap"></div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title" id="agendaTitle">รายการ</div>
        </div>
        <div class="panel-body" id="agendaWrap"></div>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/notifications.js"></script>
<script src="js/pwa.js"></script>
<script src="js/calendar-widget.js"></script>
<script>
  const user = Auth.requireLogin();
  renderSidebar('calendar');

  let state = { tasks: [], notes: [], events: [], holidays: [] };
  let viewYear = new Date().getFullYear();
  let viewMonth = new Date().getMonth();
  let selectedDate = fmtDateInput(new Date());

  async function load() {
    const cacheKey = 'dashboard_' + user.id;
    const cached = Api.getCached(cacheKey);
    if (cached) { state = cached; renderCalendar(); renderAgenda(); }
    try {
      state = await Api.call('getDashboard', { userId: user.id });
      Api.setCached(cacheKey, state);
      renderCalendar();
      renderAgenda();
    } catch (err) { if (!cached) toast(err.message); }
  }

  function renderCalendar() {
    const entriesByDate = buildEntriesByDate(state);
    renderMonthCalendar(document.getElementById('calWrap'), {
      year: viewYear, month: viewMonth, entriesByDate, selectedDate,
      onSelectDay: (dateStr) => { selectedDate = dateStr; renderCalendar(); renderAgenda(); },
      onNavigate: (dir) => {
        if (dir === '0') { const n = new Date(); viewYear = n.getFullYear(); viewMonth = n.getMonth(); selectedDate = fmtDateInput(n); }
        else { viewMonth += parseInt(dir); if (viewMonth < 0) { viewMonth = 11; viewYear--; } if (viewMonth > 11) { viewMonth = 0; viewYear++; } }
        renderCalendar(); renderAgenda();
      }
    });
  }

  function entriesForDate(dateStr) {
    const list = [];
    state.tasks.forEach(t => { if ((t.dueDate||'').slice(0,10) === dateStr) list.push({ kind: 'งาน', type: 'task', title: t.title, id: t.id, sub: t.status === 'done' ? 'เสร็จแล้ว' : (t.priority||'ปกติ') }); });
    state.events.forEach(e => { if ((e.date||'').slice(0,10) === dateStr) list.push({ kind: e.type === 'holiday' ? 'วันหยุด' : (e.type === 'reminder' ? 'เตือนความจำ' : 'กิจกรรม'), type: e.type === 'holiday' ? 'holiday' : (e.type === 'reminder' ? 'reminder' : 'personal'), title: e.title, id: e.id, sub: e.detail||'', editable: true, raw: e }); });
    state.holidays.forEach(h => { if ((h.date||'').slice(0,10) === dateStr) list.push({ kind: 'วันหยุด', type: 'holiday', title: h.name, sub: '' }); });
    return list;
  }

  function renderAgenda() {
    document.getElementById('agendaTitle').textContent = fmtDate(selectedDate);
    const items = entriesForDate(selectedDate);
    const wrap = document.getElementById('agendaWrap');
    if (items.length === 0) {
      wrap.innerHTML = `<div class="agenda-empty">ไม่มีรายการในวันนี้ — กด "เพิ่มรายการ" เพื่อสร้างใหม่</div>`;
      return;
    }
    wrap.innerHTML = items.map((i, idx) => `
      <div class="agenda-item">
        <div class="agenda-kind kind-${i.type}">${i.kind}</div>
        <div style="flex:1; ${i.editable ? 'cursor:pointer;' : ''}" ${i.editable ? `onclick="editEvent('${i.id}')"` : ''}>
          <div class="agenda-title">${escapeHtml(i.title)}</div>
          ${i.sub ? `<div class="agenda-sub">${escapeHtml(i.sub)}</div>` : ''}
        </div>
        ${i.editable ? `<button class="btn-ghost btn-sm" onclick="deleteEvent('${i.id}')">ลบ</button>` : ''}
      </div>
    `).join('');
  }

  async function deleteEvent(id) {
    if (!confirm('ลบรายการนี้หรือไม่?')) return;
    try {
      await Api.call('eventDelete', { id, userId: user.id });
      toast('ลบแล้ว');
      await load();
    } catch (err) { toast(err.message); }
  }

  function openEventModal(existing) {
    const isNew = !existing;
    const ev = existing || { title: '', date: selectedDate, type: 'personal', detail: '' };
    openModal(`
      <div class="modal">
        <div class="modal-head"><h3>${isNew ? 'เพิ่มรายการในปฏิทิน' : 'แก้ไขรายการ'}</h3><button class="modal-close" onclick="closeModal()">×</button></div>
        <div class="modal-body">
          <div class="field"><label>ชื่อรายการ</label><input type="text" id="evTitle" value="${escapeHtml(ev.title)}" required></div>
          <div class="field-row">
            <div class="field"><label>วันที่</label><input type="date" id="evDate" value="${(ev.date||'').slice(0,10)}" required></div>
            <div class="field"><label>ประเภท</label>
              <select id="evType">
                <option value="personal" ${ev.type==='personal'?'selected':''}>กิจกรรม</option>
                <option value="reminder" ${ev.type==='reminder'?'selected':''}>เตือนความจำ</option>
                <option value="holiday" ${ev.type==='holiday'?'selected':''}>วันหยุดส่วนตัว</option>
              </select>
            </div>
          </div>
          <div class="field"><label>รายละเอียด (ถ้ามี)</label><textarea id="evDetail" rows="3">${escapeHtml(ev.detail||'')}</textarea></div>
        </div>
        <div class="modal-foot">
          ${isNew ? '<span></span>' : `<button class="btn-danger" id="evDeleteBtn">ลบ</button>`}
          <div>
            <button class="btn-ghost" onclick="closeModal()">ยกเลิก</button>
            <button class="btn" id="saveEventBtn">บันทึก</button>
          </div>
        </div>
      </div>
    `);
    document.getElementById('saveEventBtn').addEventListener('click', async (e) => {
      const title = document.getElementById('evTitle').value.trim();
      const date = document.getElementById('evDate').value;
      const type = document.getElementById('evType').value;
      const detail = document.getElementById('evDetail').value.trim();
      if (!title || !date) { toast('กรุณากรอกชื่อและวันที่'); return; }
      setLoading(e.target, true);
      try {
        if (isNew) await Api.call('eventCreate', { userId: user.id, title, date, type, detail });
        else await Api.call('eventUpdate', { id: ev.id, userId: user.id, title, date, type, detail });
        closeModal();
        toast('บันทึกแล้ว');
        selectedDate = date;
        await load();
      } catch (err) { toast(err.message); setLoading(e.target, false); }
    });
    if (!isNew) {
      document.getElementById('evDeleteBtn').addEventListener('click', async () => {
        if (!confirm('ลบรายการนี้หรือไม่?')) return;
        try {
          await Api.call('eventDelete', { id: ev.id, userId: user.id });
          closeModal();
          toast('ลบแล้ว');
          await load();
        } catch (err) { toast(err.message); }
      });
    }
  }

  function editEvent(id) {
    const ev = state.events.find(e => e.id === id);
    if (ev) openEventModal(ev);
  }

  document.getElementById('addEventBtn').addEventListener('click', () => openEventModal(null));
  wireRefreshButton('refreshBtn', load);

  load();
</script>
</body>
</html>
