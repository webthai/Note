<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note — บันทึก</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111110">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
    <div class="page-head">
      <div>
        <div class="page-eyebrow">จดไว้กันลืม</div>
        <h1>บันทึก</h1>
      </div>
      <div class="head-actions">
        <button class="refresh-btn" id="refreshBtn"><span class="glyph">⟳</span> รีเฟรช</button>
        <button class="btn" id="newNoteBtn">+ บันทึกใหม่</button>
      </div>
    </div>

    <div class="notes-layout">
      <div class="notes-list" id="notesList"></div>
      <div class="note-editor" id="noteEditor">
        <div class="empty-state" style="margin: auto;">
          <div class="glyph">✎</div>
          เลือกบันทึกทางซ้าย หรือกด "บันทึกใหม่" เพื่อเริ่มเขียน
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/notifications.js"></script>
<script src="js/pwa.js"></script>
<script>
  const user = Auth.requireLogin();
  renderSidebar('notes');

  let notes = [];
  let activeId = null;
  let dirty = false;

  // Only attach beforeunload WHILE there's something unsaved — its mere
  // presence disables the browser's back/forward cache (bfcache), which
  // makes every page navigation slower. Attaching it only when needed
  // keeps bfcache available the rest of the time.
  function beforeUnloadHandler(e) { e.preventDefault(); e.returnValue = ''; }
  function setDirty(value) {
    if (dirty === value) return;
    dirty = value;
    if (dirty) window.addEventListener('beforeunload', beforeUnloadHandler);
    else window.removeEventListener('beforeunload', beforeUnloadHandler);
  }

  async function load(force) {
    const cacheKey = 'notes_' + user.id;
    const cached = Api.getCached(cacheKey);
    if (cached && notes.length === 0 && !force) { notes = cached; renderList(); }
    try {
      const data = await Api.call('notesList', { userId: user.id, force: force ? 1 : undefined });
      notes = data.notes;
      Api.setCached(cacheKey, notes);
      renderList();
      if (activeId && !notes.find(n => n.id === activeId)) { activeId = null; renderEditor(); }
      else if (activeId && !dirty) { renderEditor(); }
    } catch (err) { if (!cached) toast(err.message); }
  }

  function renderList() {
    const el = document.getElementById('notesList');
    if (notes.length === 0) {
      el.innerHTML = `<div class="empty-state">ยังไม่มีบันทึก</div>`;
      return;
    }
    el.innerHTML = notes.map(n => `
      <div class="note-item ${n.id === activeId ? 'active' : ''}" data-id="${n.id}">
        <div class="note-item-title">${escapeHtml(n.title || 'ไม่มีชื่อ')}</div>
        <div class="note-item-sub">${fmtDate(n.updatedAt)}</div>
      </div>
    `).join('');
    el.querySelectorAll('.note-item').forEach(item => {
      item.addEventListener('click', () => {
        if (dirty && !confirm('มีการแก้ไขที่ยังไม่บันทึก ต้องการออกจากบันทึกนี้หรือไม่?')) return;
        activeId = item.dataset.id;
        setDirty(false);
        renderList();
        renderEditor();
      });
    });
  }

  function renderEditor() {
    const editor = document.getElementById('noteEditor');
    const note = notes.find(n => n.id === activeId);
    if (!note) {
      editor.innerHTML = `<div class="empty-state" style="margin:auto;"><div class="glyph">✎</div>เลือกบันทึกทางซ้าย หรือกด "บันทึกใหม่" เพื่อเริ่มเขียน</div>`;
      return;
    }
    editor.innerHTML = `
      <input type="text" id="titleInput" value="${escapeHtml(note.title)}" placeholder="ชื่อบันทึก">
      <textarea id="contentInput" placeholder="เขียนบันทึกของคุณที่นี่...">${escapeHtml(note.content)}</textarea>
      <div class="flex-between mt-16">
        <input type="text" id="tagsInput" value="${escapeHtml(note.tags)}" placeholder="แท็ก (คั่นด้วยจุลภาค)" style="border:1px solid var(--line-strong); padding:7px 10px; font-size:12.5px; width:260px;">
        <div>
          <button class="btn-danger btn-sm" id="deleteBtn">ลบ</button>
          <button class="btn btn-sm" id="saveBtn">บันทึก</button>
        </div>
      </div>
    `;
    document.getElementById('titleInput').addEventListener('input', () => setDirty(true));
    document.getElementById('contentInput').addEventListener('input', () => setDirty(true));
    document.getElementById('tagsInput').addEventListener('input', () => setDirty(true));

    document.getElementById('saveBtn').addEventListener('click', async (e) => {
      const title = document.getElementById('titleInput').value.trim() || 'ไม่มีชื่อ';
      const content = document.getElementById('contentInput').value;
      const tags = document.getElementById('tagsInput').value.trim();
      setLoading(e.target, true);
      try {
        await Api.call('noteUpdate', { id: note.id, userId: user.id, title, content, tags });
        setDirty(false);
        toast('บันทึกแล้ว');
        await load();
      } catch (err) { toast(err.message); }
      setLoading(e.target, false);
    });

    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm('ลบบันทึกนี้ถาวรหรือไม่?')) return;
      try {
        await Api.call('noteDelete', { id: note.id, userId: user.id });
        activeId = null; setDirty(false);
        toast('ลบแล้ว');
        await load();
      } catch (err) { toast(err.message); }
    });
  }

  document.getElementById('newNoteBtn').addEventListener('click', async () => {
    if (dirty && !confirm('มีการแก้ไขที่ยังไม่บันทึก ต้องการสร้างบันทึกใหม่หรือไม่?')) return;
    try {
      const data = await Api.call('noteCreate', { userId: user.id, title: 'บันทึกใหม่', content: '', tags: '' });
      setDirty(false);
      await load();
      activeId = data.note.id;
      renderList();
      renderEditor();
      document.getElementById('titleInput').focus();
      document.getElementById('titleInput').select();
    } catch (err) { toast(err.message); }
  });

    wireRefreshButton('refreshBtn', async () => {
    if (dirty && !confirm('มีการแก้ไขที่ยังไม่บันทึก รีเฟรชแล้วจะหายไป ต้องการดำเนินการต่อหรือไม่?')) return;
    setDirty(false);
    await load(true);
  });
  load();
</script>
</body>
</html>
